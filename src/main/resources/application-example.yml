server:
  port: 8080

spring:
  application:
    name: crm-system

  datasource:
    url: jdbc:mysql://localhost:3306/crm_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password_here      # 改为你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

  rabbitmq:
    host: localhost
    port: 5672
    username: admin                   # 改为你的 RabbitMQ 用户名
    password: your_password_here      # 改为你的 RabbitMQ 密码
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info

feishu:
  webhook-url: https://open.feishu.cn/open-apis/bot/v2/hook/your-webhook-token  # 改为你的飞书 Webhook
